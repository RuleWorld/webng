# Runs the WEBNG test suite on every push and pull request: on Linux and on
# macOS (Apple Silicon), for each supported Python version. Each runs the full
# suite, real simulations included, with WEBNG's libssa build for that
# platform (see libssa/README.md).
#
# macOS runners are scarce (a few at a time, shared across the organization),
# so the macOS jobs can wait in a queue before starting. If that becomes a
# problem, test macOS on one Python version only.
#
# NOTE: this workflow only runs tests. Publishing to PyPI (twine upload)
# is still commented out below pending the packaging/versioning decisions
# tracked separately (see PyPI / distribution items in the dev task list).

name: webng-tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Every Python version WEBNG supports. (Anaconda stopped building new
        # Python 3.10 packages for its main channel at the end of October 2026,
        # so newer versions need to keep working.)
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        # dependencies are defined in setup.py, so key the cache on it; one
        # cache per Python version, so the parallel jobs don't clash saving it
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('setup.py') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Build
      run: |
        pip install .[dev]
    - name: Override bionetgen with unreleased upstream fix
      # PyPI's bionetgen==0.8.7 has a real bug in setup_simulator(): it
      # writes the SBML temp file relative to cwd instead of inside
      # tmp_folder, then checks for it in tmp_folder -- always fails with
      # "SBML generation did not produce temp_sbml.xml" for the
      # libRoadRunner propagator. The fix (RuleWorld/PyBioNetGen, see
      # bionetgen/modelapi/model.py's setup_simulator) is merged to main
      # but hasn't shipped in a PyPI release yet (main's VERSION file is
      # still "0.8.7", same as the stale published wheel -- there's no
      # newer version number to pin to). Remove this step once a PyPI
      # release actually includes the fix.
      #
      # --no-build-isolation: PyBioNetGen's own setup.py unconditionally
      # runs `python -m pip install numpy` at import time (before setup()
      # even runs). Installing from a git URL forces a source build,
      # which by default happens in an isolated build sandbox that
      # doesn't have pip itself available as a module -- that recursive
      # call then fails with "No module named pip". Building against the
      # already-active environment (which has both pip and numpy from
      # the main install step above) avoids this entirely.
      run: |
        pip install --force-reinstall --no-deps --no-build-isolation "git+https://github.com/RuleWorld/PyBioNetGen.git"
    - name: Patch bionetgen write_xml cwd bug (not fixed upstream yet)
      # A second, separate instance of the same cwd-mismatch bug class:
      # write_xml() in bngfile.py runs BNG2.pl with cwd=temp_folder, then
      # checks/reads its output using a bare relative filename (resolved
      # against this process's cwd, not temp_folder) -- so it never finds
      # what BNG2.pl actually wrote. This is what's actually producing
      # "SBML generation did not produce temp_sbml.xml" for the
      # libRoadRunner propagator; the upstream fix already merged to
      # model.py doesn't touch this function. Not yet reported upstream.
      # Remove this step once RuleWorld/PyBioNetGen has its own fix.
      run: |
        python .github/scripts/patch_bionetgen_write_xml_cwd.py
    - name: Test with PyTest
      run: |
        pytest -s
