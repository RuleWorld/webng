# Runs the WEBNG test suite on every push and pull request.
#
# macOS is intentionally excluded from the matrix: libssa.so (the bng
# propagator's shared library) is a Linux ELF binary, so tests that touch
# the bng propagator cannot run on macOS runners at all. If a macOS build
# of libssa.so is produced later, macOS can be added back.
#
# NOTE: this workflow only runs tests. Publishing to PyPI (twine upload)
# is still commented out below pending the packaging/versioning decisions
# tracked separately (see PyPI / distribution items in the dev task list).

name: webng-tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Keep this aligned with the Python version(s) actually used for
        # WEBNG development (currently 3.10). Expand once compatibility
        # with newer versions is confirmed (cement/westpa/bionetgen pin
        # behavior is unverified beyond what's listed here).
        python-version: ["3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Build
      run: |
        pip install .[dev]
    - name: Test with PyTest
      run: |
        pytest -s
    - name: Debug BNG2.pl SBML export (diagnostic for libRoadRunner failure)
      # Runs regardless of whether pytest passed, so this always shows up
      # even if the SBML-related test above failed. See
      # .github/scripts/debug_sbml.py for what this does and why.
      if: always()
      run: |
        python .github/scripts/debug_sbml.py
